name: Leak or failure test
description: Report a reproducible VPN leak, bypass or transition failure
title: "test: "
labels: [security, testing]
body:
  - type: markdown
    attributes:
      value: |
        Do not publish exploitable vulnerability details here. For security vulnerabilities follow SECURITY.md.
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Describe the network state and failure injection.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include sanitized logs, addresses, screenshots or test output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected invariant
      value: VPN_NOT_VERIFIED -> INTERNET_TRAFFIC = BLOCKED
