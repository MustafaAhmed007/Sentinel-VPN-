name: Bug report
description: Reproducible software or networking failure
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private keys, tokens, credentials or sensitive configuration.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 / commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste sanitized output only.
