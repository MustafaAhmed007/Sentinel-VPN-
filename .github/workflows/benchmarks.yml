name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'server/**'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

jobs:
  rust-bench:
    name: Rust benchmark smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile benchmark targets
        run: cargo test --workspace --no-fail-fast
      - name: Record benchmark policy
        shell: bash
        run: |
          mkdir -p evidence
          printf '%s\n' '{"type":"ci-benchmark-smoke","status":"passed","note":"Use real-device reports for network performance and leak measurements."}' > evidence/benchmark-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: evidence/benchmark-smoke.json
