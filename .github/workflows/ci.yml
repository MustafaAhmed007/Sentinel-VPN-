name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Format check
        run: cargo fmt --all -- --check

  desktop:
    name: Desktop web build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package.json
      - run: npm install
      - run: npm run build

  server:
    name: Go checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - name: Resolve and verify modules
        run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/sentinel-server

  security:
    name: Secret and dependency baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify no obvious private-key files are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(.*private.*key.*|.*\.key)$' >/dev/null; then
            echo 'Potential key material is tracked. Remove it before merge.'
            exit 1
          fi
