[package]
name = "sentinel-vpn-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sentinel_vpn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sentinel-vpn-desktop"
